<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grundriss – Klickbare Raum-Punkte</title>
<style>
  :root {
    --paper:#f4f2ec; --panel:#fff; --ink:#1b2430; --muted:#6a7280; --line:#d8d5cc;
    --accent:#2f5c9e; --accent-soft:#e6edf7; --pin:#2f5c9e; --pin-has:#2f8f5b; --pin-part:#c07f22;
    --badge-ink:#fff; --good:#2f8f5b; --warn:#b25a1e; --danger:#b0393c;
    --shadow:0 1px 2px rgba(20,30,45,.06),0 8px 24px rgba(20,30,45,.08);
    --mono:ui-monospace,"SFMono-Regular","Cascadia Code",Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#10141a;--panel:#171d26;--ink:#e7ecf3;--muted:#8b95a4;--line:#2a323d;
    --accent:#6fa3e6;--accent-soft:#1c2836;--pin:#6fa3e6;--pin-has:#4bbd82;--pin-part:#d9a04b;
    --badge-ink:#0d1219;--good:#4bbd82;--warn:#d98b4e;--danger:#e07a7d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --paper:#10141a;--panel:#171d26;--ink:#e7ecf3;--muted:#8b95a4;--line:#2a323d;
    --accent:#6fa3e6;--accent-soft:#1c2836;--pin:#6fa3e6;--pin-has:#4bbd82;--pin-part:#d9a04b;
    --badge-ink:#0d1219;--good:#4bbd82;--warn:#d98b4e;--danger:#e07a7d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;} body{margin:0;background:var(--paper);}
  .app{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;display:flex;flex-direction:column;}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--panel) 70%,transparent);position:sticky;top:0;z-index:30;backdrop-filter:blur(8px);flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
  .brand h1{font-size:15px;margin:0;font-weight:650;}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  button.btn{font-family:var(--sans);font-size:13px;font-weight:550;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .12s,border-color .12s;}
  button.btn:hover{background:var(--accent-soft);border-color:var(--accent);}
  button.btn.ghost{background:transparent;}
  button.btn.on{background:var(--accent);color:var(--badge-ink);border-color:var(--accent);}
  button.btn.small,.btn-sm{font-size:12px;padding:5px 9px;}
  .savechip{font-family:var(--mono);font-size:11px;color:var(--good);display:inline-flex;align-items:center;gap:6px;opacity:0;transition:opacity .3s;}
  .savechip.show{opacity:1;} .savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
  .lodwrap{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .lodwrap button{border:0;background:var(--panel);font-size:11.5px;font-family:var(--mono);padding:7px 9px;cursor:pointer;color:var(--muted);}
  .lodwrap button.on{background:var(--accent);color:var(--badge-ink);}

  .main{display:grid;grid-template-columns:minmax(0,1fr) 440px;flex:1;min-height:0;}
  @media (max-width:920px){.main{grid-template-columns:1fr;}}
  .stage{padding:18px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line);min-width:0;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);}
  .legend .item{display:inline-flex;align-items:center;gap:7px;}
  .legend .dotm{width:15px;height:15px;border-radius:50%;border:2px solid var(--panel);box-shadow:var(--shadow);}
  .legend .empty{background:var(--pin);} .legend .part{background:var(--pin-part);} .legend .filled{background:var(--pin-has);}
  .canvas-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;overflow:auto;}
  .canvas{position:relative;display:inline-block;line-height:0;min-width:100%;}
  .canvas.placing{cursor:crosshair;}
  .canvas img.bg{max-width:100%;border-radius:8px;display:block;}
  .drop{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;
    min-height:320px;color:var(--muted);font-size:14px;border:2px dashed var(--line);border-radius:10px;line-height:1.5;padding:20px;}
  .drop.hover{border-color:var(--accent);background:var(--accent-soft);}
  .drop .hint{font-size:12px;}
  .pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--pin);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;
    border:2.5px solid var(--panel);box-shadow:var(--shadow);user-select:none;touch-action:none;line-height:1;}
  .pin.part{background:var(--pin-part);}
  .pin.has{background:var(--pin-has);}
  .pin.sel{outline:3px solid var(--accent);outline-offset:2px;}
  .pin.drag{opacity:.75;}
  .pin .plabel{position:absolute;top:110%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:600;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:1px 6px;pointer-events:none;}
  .pin .obadge{position:absolute;top:-7px;right:-9px;background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;font-size:9.5px;font-weight:700;padding:0 4px;line-height:1.5;}

  .panel{overflow-y:auto;max-height:calc(100vh - 62px);padding:18px;background:var(--paper);}
  @media (max-width:920px){.panel{max-height:none;}}
  .empty-state{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.6;}
  .empty-state h2{font-size:15px;margin:0 0 10px;}
  .empty-state ol{margin:0 0 10px;padding-left:20px;} .empty-state p{margin:8px 0;}
  .hint{font-size:12px;color:var(--muted);}
  .sep{border:0;border-top:1px solid var(--line);margin:14px 0;}

  .ed-head{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;align-items:stretch;}
  .num-input{width:64px;text-align:center;font-weight:700;}
  .name-input{width:100%;font-weight:650;font-size:15px;padding:10px 12px;}
  input[type=text],input[type=number],input:not([type]),select,textarea{
    font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;}
  textarea.notes{min-height:84px;resize:vertical;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .field>label{display:block;font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .cards{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .card img.media,.card video.media,.card iframe.media{width:100%;display:block;max-height:260px;object-fit:contain;background:#00000008;border:0;}
  .card iframe.media{aspect-ratio:16/9;}
  .cap{display:flex;gap:6px;padding:7px;}
  .cap input{font-size:12px;padding:5px 8px;}
  .icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;width:30px;flex:0 0 30px;cursor:pointer;}
  .icon-btn:hover{color:var(--danger);border-color:var(--danger);}
  .add-row{display:flex;flex-direction:column;gap:8px;}
  .url-row{display:flex;gap:6px;} .url-row input{flex:1;}
  .visually-file{display:none;}
  .link-card{padding:10px;font-size:12.5px;word-break:break-all;}
  .footer-actions{display:flex;gap:8px;justify-content:flex-end;}
  .danger{color:var(--danger);}

  /* room panel additions */
  .crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .crumb button{font-size:12.5px;}
  .rt-row{display:flex;gap:8px;align-items:center;}
  .rt-row select{flex:1;}
  .predbadge{font-family:var(--mono);font-size:10px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:2px 6px;white-space:nowrap;}
  .checklist{display:flex;flex-direction:column;gap:8px;}
  .chk{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;}
  .chk:hover{border-color:var(--accent);}
  .chk .cname{flex:1;font-size:13.5px;font-weight:550;}
  .chk .cnt{font-family:var(--mono);font-size:11px;color:var(--badge-ink);background:var(--good);border-radius:9px;padding:1px 7px;}
  .chk .cnt.zero{background:var(--line);color:var(--muted);}
  .chk .nv{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:transparent;cursor:pointer;}
  .chk.isnv{opacity:.55;} .chk.isnv .nv{background:var(--line);}
  .chk .gw{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.03em;}
  .objlist{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .obj{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;}
  .obj:hover{border-color:var(--accent);}
  .obj .oname{flex:1;min-width:0;} .obj .oname .t{font-size:13.5px;font-weight:600;}
  .obj .oname .s{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .obj .prog{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .obj .prog.done{color:var(--good);}
  .copybadge{font-family:var(--mono);font-size:9.5px;background:var(--warn);color:var(--badge-ink);border-radius:5px;padding:1px 5px;}
  .pickwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;}
  .pickwrap h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .picklist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
  .picklist button{text-align:left;font-size:13px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);}
  .picklist button:hover{border-color:var(--accent);background:var(--accent-soft);}
  .picklist .sub{font-size:11px;color:var(--muted);display:block;}
  .copysugg{border-left:3px solid var(--warn);padding-left:9px;margin:8px 0;}

  /* question form */
  .qgroup{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .qgroup>h4{margin:0;padding:10px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 60%,var(--panel));display:flex;justify-content:space-between;}
  .qbody{padding:12px 14px;display:flex;flex-direction:column;gap:14px;}
  .qrow label.qq{display:block;font-size:13px;font-weight:550;margin-bottom:6px;line-height:1.4;}
  .qrow label.qq .req{color:var(--danger);}
  .qrow .qhelp{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45;}
  .qrow .unit{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px;}
  .ynrow,.chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:12.5px;cursor:pointer;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--badge-ink);}
  .numrow{display:flex;align-items:center;gap:6px;} .numrow input{max-width:140px;}
  .fotorow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .fthumb{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .fthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .fthumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:11px;cursor:pointer;line-height:1;}
  .fotomiss{font-size:11px;color:var(--danger);}
  .subwrap{border-top:1px dashed var(--line);margin-top:4px;padding-top:12px;}
  .subrow{border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:10px;margin-bottom:8px;overflow:hidden;
    background:color-mix(in srgb,var(--ink) 5%,var(--panel));}
  .subrow .subrow{background:color-mix(in srgb,var(--ink) 9%,var(--panel));}
  .gwrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:9px;margin-bottom:6px;}
  .gwrow .gq{flex:1;font-size:13px;font-weight:550;}
  .submore{font-size:11.5px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:5px 9px;cursor:pointer;margin:2px 0 8px;}
  .submore:hover{color:var(--accent);border-color:var(--accent);}
  .subhead{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;}
  .subhead .n{flex:1;} .subhead .tw{color:var(--muted);font-weight:400;font-size:12px;}
  .subbody{padding:0 12px 12px;}
  .subadd{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .subadd button{font-size:11.5px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:5px 9px;cursor:pointer;}
  .subadd button:hover{color:var(--accent);border-color:var(--accent);}
  .memo-rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .memo-rec .rec{background:var(--danger);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;}
  .memo-rec .rec.recording{animation:pulse 1.2s infinite;}
  @keyframes pulse{50%{opacity:.55;}}
  .memolist{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .memoitem{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;}
  .memoitem audio{flex:1;height:32px;min-width:0;}
  .storagechip{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .micwarn{font-size:12px;color:var(--warn);line-height:1.45;}
  .lodnote{font-size:11px;color:var(--muted);font-family:var(--mono);}
  .wz-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .wz{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:24px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;font-family:var(--sans);color:var(--ink);}
  .wz h2{font-size:17px;margin:0 0 14px;}
  .wz-modes{display:flex;gap:8px;margin-bottom:16px;}
  .wz-two{display:grid;grid-template-columns:110px 1fr;gap:10px;}
  .wz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;align-items:center;}
  .plist{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;margin-top:6px;}
  .prow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;}
  .prow:hover{border-color:var(--accent);}
  .prow .pn{flex:1;min-width:0;} .prow .pn .t{font-size:14px;font-weight:600;}
  .prow .pn .s{font-size:11.5px;color:var(--muted);}
  .prow .del{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:4px 8px;font-size:11px;cursor:pointer;}
  .prow .del:hover{color:var(--danger);border-color:var(--danger);}
  .wz .btn.on{background:var(--accent);color:var(--badge-ink);border-color:var(--accent);}
  /* Sidebar-Shell */
  .shell{display:flex;min-height:100vh;}
  .side{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:16px 12px 12px;position:sticky;top:0;height:100vh;box-sizing:border-box;}
  .sbrand h1{font-size:16px;margin:0;font-weight:700;}
  .sbrand .ssub{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .snav{display:flex;flex-direction:column;gap:3px;margin-top:18px;flex:1;}
  .sitem{display:flex;align-items:center;gap:9px;text-align:left;padding:9px 11px;border-radius:9px;border:0;
    background:transparent;color:var(--ink);font:550 13.5px var(--sans);cursor:pointer;width:100%;}
  .sitem:hover{background:var(--accent-soft);}
  .sitem.on{background:var(--accent);color:var(--badge-ink);}
  .sfoot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;}
  .userchip{font-size:11.5px;color:var(--muted);word-break:break-all;padding:0 4px;}
  .srow{display:flex;gap:6px;}
  .content{flex:1;min-width:0;display:flex;flex-direction:column;}
  .sitem .ic{width:20px;display:inline-block;text-align:center;flex:0 0 20px;}
  .side.collapsed{width:64px;flex-basis:64px;padding:16px 8px 12px;}
  .side.collapsed .sbrand,.side.collapsed .sitem span,.side.collapsed .userchip{display:none;}
  .side.collapsed .sitem{justify-content:center;padding:10px 0;}
  .side.collapsed .srow{flex-direction:column;}
  #sideToggle{align-self:flex-end;margin-bottom:4px;}
  .mob-only{display:none;}
  @media (max-width:920px){
    .shell{flex-direction:column;}
    .side{width:100%!important;flex:0 0 auto!important;position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;
      flex-direction:row;padding:0;border-right:0;border-top:1px solid var(--line);z-index:60;
      box-shadow:0 -4px 16px rgba(0,0,0,.08);}
    .sbrand,.sfoot,#sideToggle,.sgroup,#sideAreas{display:none!important;}
    .snav{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0;flex:1;}
    .sitem{flex-direction:column;gap:2px;justify-content:center;align-items:center;border-radius:0;
      padding:8px 2px calc(8px + env(safe-area-inset-bottom));font-size:10.5px;font-weight:600;}
    .sitem .ic{font-size:18px;width:auto;flex:none;}
    .content{padding-bottom:64px;}
    .mob-only{display:flex;gap:8px;margin-top:14px;}
    .bar{padding:8px 10px;}
    .tools{gap:6px;}
  }
  /* Projektseite */
  .ppage{display:flex;flex-direction:column;gap:14px;}
  .pp-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .ppage .plist{max-height:none;}
  /* Bereiche */
  .arearow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .arearow .an{flex:1;font-size:13px;font-weight:550;}
  .arearow .at{font-size:11px;color:var(--muted);}
  .sgroup{display:flex;align-items:center;gap:6px;margin-top:14px;padding:4px 11px 2px;
    font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
  .sgroup .areaadd{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1;}
  .sgroup .areaadd:hover{color:var(--accent);border-color:var(--accent);}
  #sideAreas .sitem{font-size:12.5px;padding:7px 11px 7px 18px;}
  .side.collapsed .sgroup,.side.collapsed #sideAreas{display:none;}
  #planHead .ctxsel{width:auto;font-size:12.5px;padding:6px 9px;}
  #planHead .dtitle{font-size:17px;}
  #planHead input.bname{font-weight:650;font-size:15px;max-width:220px;}
  .typbadge{font-family:var(--mono);font-size:10px;background:var(--accent-soft);color:var(--accent);
    border-radius:5px;padding:2px 7px;white-space:nowrap;}
  /* Auth */
  .auth-logo{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);display:flex;
    align-items:center;justify-content:center;font-size:26px;margin-bottom:14px;}

  .dash-head .daddr{font-size:12.5px;color:var(--muted);}
  .dash-head .spacer{flex:1;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;}

  // Typenschild-Gate (mechanisch): Basis-Foto nur nach "Typenschild vorhanden? = Ja"
  for(var i=0;i<qs.length;i++){

      var gated={}; for(var kk in qs[i]) gated[kk]=qs[i][kk];

               p:false,fp:false,kl:gated.kl,r:(gated.r||90)-1,lod:gated.lod||200,z:"Laie",e:"Objekt"});

function loadPdfPlan(file){
  function doRender(){
    var pdfjs=window.pdfjsLib;
    file.arrayBuffer().then(function(buf){
      return pdfjs.getDocument({data:buf}).promise;
    }).then(function(doc){
      var n=doc.numPages, pg=1;
      if(n>1){
        var ans=prompt(t("pdfPage").replace(/\{n\}/g,String(n)),"1");
        if(ans===null) return null;
        pg=Math.min(Math.max(parseInt(ans,10)||1,1),n);
      }
      return doc.getPage(pg);
    }).then(function(page){
      if(!page) return;
      var vp=page.getViewport({scale:1});
      var scale=Math.min(3,1600/Math.max(vp.width,vp.height));
      vp=page.getViewport({scale:scale});
      var c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      return page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise.then(function(){
        ctxObj().image=c.toDataURL("image/jpeg",0.85);
        bgImg=null; save(); renderCanvas();
        var mine=data.pins.filter(function(p){return (p.bereichId||"")===planCtx;});
        if(!mine.length) setPlacing(true);
      });
    }).catch(function(){ alert(t("pdfErr")); });
  }
  if(window.pdfjsLib) return doRender();
  if(!/^https?:$/.test(location.protocol)){ alert(t("pdfErr")); return; }
  var sc=document.createElement("script");
  sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  sc.onload=function(){
    try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
    doRender();
  };
  sc.onerror=function(){ alert(t("pdfErr")); };
  document.head.appendChild(sc);
}
function loadImageFile(file){
  if(!file) return;
  if(file.type==="application/pdf") return loadPdfPlan(file);
  if(!/^image\//.test(file.type)) return;
  shrinkImage(file,1600).then(function(blob){
    var rd=new FileReader();
    rd.onload=function(){
      ctxObj().image=rd.result; bgImg=null; save(); renderCanvas();
      var mine=data.pins.filter(function(p){return (p.bereichId||"")===planCtx;});
      if(!mine.length){ setPlacing(true); }
    };
    rd.readAsDataURL(blob);
  }).catch(function(){ alert(t("errPhoto")); });
}

/* ================= Fragen-Logik ================= */
function parseCond(b){
  if(!b||b==="immer") return null;
  var m=b.match(/^«(.+?)»\s*(=|ungleich)\s*'?(.*?)'?$/);
  if(!m) return null;
  return {t:m[1],op:m[2],v:m[3]};
}
function condMet(inst,b){
  var c=parseCond(b);
  if(!c) return true;
  var val=(inst.a||{})[c.t];
  if(Array.isArray(val)){
    var has=val.indexOf(c.v)>=0;
    return c.op==="="?has:(val.length>0&&!has);
  }
  var hasS=String(val===undefined?"":val)===c.v;
  return c.op==="="?hasS:(!hasS&&val!==undefined&&val!=="");
}
function visibleQuestions(inst){
  return questionsFor(inst.k,inst.y,inst.art).filter(function(q){
    if(q.lod>LOD) return false;
    return condMet(inst,q.b);
  });
}
function hasCondOn(inst,titel){
  var pool=inst.k==="(Raum)"?(KAT.R||[]):questionsFor(inst.k,inst.y,inst.art);
  for(var i=0;i<pool.length;i++){ var c=parseCond(pool[i].b); if(c&&c.t===titel) return true; }
  return false;
}
function answered(inst,q){
  if(q.at==="Foto-Upload") return ((inst.fotos||{})[q.t]||[]).length>0;
  var v=(inst.a||{})[q.t];
  if(v===undefined||v===null) return false;
  if(Array.isArray(v)) return v.length>0;
  return String(v)!=="";
}
function newInst(klasse,typ){
  var row=typRow[klasse+"||"+typ]||{};
  return { iid:uid(), k:klasse, y:typ, art:(row[2]||"O"), gewerk:row[3]||"", label:"", a:{}, fotos:{}, memos:[], subs:[] };
}
function deepCopyInst(src){
  var c=newInst(src.k,src.y);
  c.a=JSON.parse(JSON.stringify(src.a||{}));
  c.label=src.label||"";
  c.copiedFrom=src.iid;
  c.subs=(src.subs||[]).map(deepCopyInst);
  return c; // Fotos + Memos bewusst NICHT kopiert
}
function findInstOwner(iid){
  var res=null;
  function walk(list,owner){ list.forEach(function(o){ if(o.iid===iid) res={inst:o,owner:owner,list:list}; walk(o.subs||[],owner); }); }
  data.pins.forEach(function(p){ walk(p.objekte||[],{type:"pin",pin:p}); });
  walk(data.gebaeude.objekte||[],{type:"geb"});
  return res;
}
function allInstances(filterFn){
  var out=[];
  function walk(list,where){ list.forEach(function(o){ if(!filterFn||filterFn(o)) out.push({inst:o,where:where}); walk(o.subs||[],where); }); }
  data.pins.forEach(function(p){ walk(p.objekte||[],p.name); });
  walk(data.gebaeude.objekte||[],"Gebäude");
  return out;
}
function dynOptions(q,inst){
  var marker=(q.ao[0]||"");
  var out=[];
  if(/Rohrleitungs/.test(marker)){
    allInstances(function(o){ return /leitung/i.test(o.y); }).forEach(function(e){
      if(e.inst.iid!==inst.iid) out.push(e.where+" · "+e.inst.y+(e.inst.label?" ("+e.inst.label+")":""));
    });
  } else if(/Verteiler/.test(marker)){
    allInstances(function(o){ return /verteiler|weiche/i.test(o.y); }).forEach(function(e){
      out.push(e.where+" · "+e.inst.y+(e.inst.label?" ("+e.inst.label+")":""));
    });
  } else if(/Außenwand/.test(marker)){
    (data.gebaeude.objekte||[]).filter(function(o){return o.k==="Bauphysik – Hülle (opak)";}).forEach(function(o){
      out.push(o.y+(o.label?" ("+o.label+")":"")+((o.a||{}).BT_Bezeichnung?" – "+o.a.BT_Bezeichnung:""));
    });
  }
  out.push("weiß nicht");
  return out;
}

function subBlock(parent,s,idx,ctx,pinId){

  h.appendChild(x);

  h.addEventListener("click",function(){ s._open=!s._open; body.style.display=s._open?"block":"none"; if(s._open&&!body.childNodes.length) buildSub(); });

    body.appendChild(nsw);

function parentTop(inst,ctx,pinId){
  // find top-level instance containing inst
  var lists=ctx==="geb"?[data.gebaeude.objekte]:[ (pinById(pinId)||{}).objekte||[] ];
  var top=null;
  function walk(o,root){ if(o===inst) top=root; (o.subs||[]).forEach(function(s){walk(s,root);}); }
  lists[0].forEach(function(o){ walk(o,o); });
  return top?top.iid:inst.iid;
}

/* -------- Sprachmemo-Widget -------- */
var activeRec=null;
function memoWidget(memoIds,onChange){
  var wrap=el("div");
  var row=el("div","memo-rec");
  var supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  var btn=el("button","rec",t("memoBtn"));
  var timer=el("span","hint","");
  row.appendChild(btn); row.appendChild(timer);
  wrap.appendChild(row);
  var list=el("div","memolist"); wrap.appendChild(list);
  (memoIds||[]).forEach(function(mid){
    var it=el("div","memoitem");
    var au=document.createElement("audio"); au.controls=true;
    mediaGet(mid).then(function(b){ if(b) au.src=URL.createObjectURL(b); });
    var x=el("button","icon-btn","✕");
    x.addEventListener("click",function(){ memoIds.splice(memoIds.indexOf(mid),1); mediaDel(mid); onChange(); });
    it.appendChild(au); it.appendChild(x); list.appendChild(it);
  });
  if(!supported){
    wrap.appendChild(el("div","micwarn",t("micWarn1")));
    btn.disabled=true; return wrap;
  }
  var rec=null, chunks=[], t0=0, tick=null;
  btn.addEventListener("click",function(){
    if(rec){ rec.stop(); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mime=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":(MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"");
      rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
      chunks=[]; t0=Date.now();
      btn.classList.add("recording"); btn.textContent=t("stop");
      tick=setInterval(function(){
        var s=Math.round((Date.now()-t0)/1000);
        timer.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
        if(s>=120){ rec.stop(); }
      },500);
      rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
      rec.onstop=function(){
        clearInterval(tick); timer.textContent="";
        btn.classList.remove("recording"); btn.textContent=t("memoBtn");
        stream.getTracks().forEach(function(t){t.stop();});
        var blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
        rec=null;
        if(blob.size<200) return;
        var mid="a"+uid();
        mediaPut(mid,blob).then(function(){ memoIds.push(mid); onChange(); });
      };
      rec.start();
    }).catch(function(){
      wrap.appendChild(el("div","micwarn",t("micWarn2")));
    });
  });
  return wrap;
}

function ytEmbed(url){
  var m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if(m) return "https://www.youtube.com/embed/"+m[1];
  var v=url.match(/vimeo\.com\/(\d+)/); if(v) return "https://player.vimeo.com/video/"+v[1];
  return null;
}

  mediaAll().then(function(media){
    var keys=Object.keys(media);
    var out={version:2,user:(USER&&USER.name)||"",data:data,media:{}};
    var done=0;
    if(!keys.length) return finish(out);
    keys.forEach(function(k){
      var rd=new FileReader();
      rd.onload=function(){ out.media[k]={t:media[k].type,b64:rd.result.split(",")[1]}; if(++done===keys.length) finish(out); };
      rd.onerror=function(){ if(++done===keys.length) finish(out); };
      rd.readAsDataURL(media[k]);
    });
  }).catch(function(){ finish({version:2,data:data,media:{}}); });
  function finish(out){
    var json=JSON.stringify(out);
    var done=function(){ btn.disabled=false; btn.textContent=t("export"); };
    var fallback=function(){
      var blob=new Blob([json],{type:"application/json"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="gebaeudeaufnahme.json"; a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},1000); done();
    };
    if(window.claude&&window.claude.use){
      window.claude.use("downloads").then(function(dl){
        if(!dl) return fallback();
        dl.save({filename:"gebaeudeaufnahme.json",data:json}).then(done).catch(function(err){
          if(err&&err.code==="declined") done(); else fallback();
        });
      }).catch(fallback);
    } else fallback();
  }
});

/* ================= Supabase (optional, ohne SDK) ================= */
var SB=null;
(function(){
  if(!SBCFG||!SBCFG.url||!SBCFG.key) return;
  var sess=null; try{ sess=JSON.parse(localStorage.getItem("tga_sb_session")||"null"); }catch(e){}
  function storeSess(x){ sess=x; try{ x?localStorage.setItem("tga_sb_session",JSON.stringify(x)):localStorage.removeItem("tga_sb_session"); }catch(e){} }
  function authFetch(path,opts,retried){
    opts=opts||{}; opts.headers=opts.headers||{};
    opts.headers["apikey"]=SBCFG.key;
    if(sess&&sess.access_token) opts.headers["Authorization"]="Bearer "+sess.access_token;
    return fetch(SBCFG.url+path,opts).then(function(r){
      if(r.status===401&&sess&&sess.refresh_token&&!retried){
        return fetch(SBCFG.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
          headers:{apikey:SBCFG.key,"Content-Type":"application/json"},
          body:JSON.stringify({refresh_token:sess.refresh_token})})
        .then(function(rr){return rr.json();})
        .then(function(j){ if(j.access_token){ storeSess(j); return authFetch(path,opts,true); } storeSess(null); throw new Error("Sitzung abgelaufen"); });
      }
      return r;
    });
  }
  SB={
    session:function(){ return sess&&sess.access_token?sess:null; },
    email:function(){ return (sess&&sess.user&&sess.user.email)||""; },
    logout:function(){ storeSess(null); },
    signup:function(email,pw){
      return fetch(SBCFG.url+"/auth/v1/signup",{method:"POST",headers:{apikey:SBCFG.key,"Content-Type":"application/json"},
        body:JSON.stringify({email:email,password:pw})}).then(function(r){return r.json();})
      .then(function(j){ if(j.error_description||j.msg&&j.code) throw new Error(j.error_description||j.msg); if(j.access_token) storeSess(j); return j; });
    },
    login:function(email,pw){
      return fetch(SBCFG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SBCFG.key,"Content-Type":"application/json"},
        body:JSON.stringify({email:email,password:pw})}).then(function(r){return r.json();})
      .then(function(j){ if(!j.access_token) throw new Error(j.error_description||j.msg||"Login fehlgeschlagen"); storeSess(j); return j; });
    },
    upload:function(pid,onMsg){
      var raw=localStorage.getItem("tga_proj_"+pid); if(!raw) return Promise.reject(new Error("Projekt nicht gefunden"));
      var d=JSON.parse(raw);
      return authFetch("/rest/v1/project_blobs",{method:"POST",
        headers:{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
        body:JSON.stringify([{project_id:pid,name:(d.projekt&&d.projekt.name)||"",payload:d}])})
      .then(function(r){
        if(!r.ok) return r.text().then(function(x){throw new Error(x.slice(0,140));});
        var ids=collectMediaIds(d), i=0, uid=sess.user.id;
        function next(){
          if(i>=ids.length) return Promise.resolve();
          var mid=ids[i++]; if(onMsg) onMsg(i+"/"+ids.length);
          return mediaGet(mid).then(function(blob){
            if(!blob) return next();
            return authFetch("/storage/v1/object/media/"+uid+"/"+pid+"/"+mid,{method:"POST",
              headers:{"x-upsert":"true","Content-Type":blob.type||"application/octet-stream"},body:blob}).then(next);
          });
        }
        return next();
      });
    },
    list:function(){
      return authFetch("/rest/v1/project_blobs?select=project_id,name,updated_at&order=updated_at.desc")
        .then(function(r){ if(!r.ok) throw new Error("Liste fehlgeschlagen ("+r.status+")"); return r.json(); });
    },
    download:function(pid,onMsg){
      return authFetch("/rest/v1/project_blobs?project_id=eq."+encodeURIComponent(pid)+"&select=payload")
      .then(function(r){return r.json();}).then(function(rows){
        if(!rows.length) throw new Error("nicht gefunden");
        var d=rows[0].payload;
        localStorage.setItem("tga_proj_"+pid,JSON.stringify(d));
        var ix=readIndex();
        if(!ix.some(function(e){return e.pid===pid;}))
          ix.unshift({pid:pid,name:(d.projekt&&d.projekt.name)||"",ort:"",rooms:(d.pins||[]).length,updated:Date.now()});
        writeIndex(ix);
        var ids=collectMediaIds(d), i=0, uid=sess.user.id;
        function next(){
          if(i>=ids.length) return Promise.resolve();
          var mid=ids[i++]; if(onMsg) onMsg(i+"/"+ids.length);
          return authFetch("/storage/v1/object/authenticated/media/"+uid+"/"+pid+"/"+mid).then(function(r){
            if(!r.ok) return next();
            return r.blob().then(function(b){ return mediaPut(mid,b).then(next); });
          });
        }
        return next();
      });
    }
  };
})();

              .catch(function(err){ ld.textContent=t("cloudLoad"); alert(t("cloudErr")+((err&&err.message)||"")); });
          });
          row.appendChild(pn); row.appendChild(ld);
          box.appendChild(row);
        });
      }).catch(function(err){
        clBtn.disabled=false; clBtn.textContent=t("cloudList");
        alert(t("cloudErr")+((err&&err.message)||""));
      });
    });
    box.appendChild(clBtn);
  }
}
function collectMediaIds(d){
  var ids=[];
  function wi(o){
    var f=o.fotos||{}; Object.keys(f).forEach(function(k){ ids=ids.concat(f[k]||[]); });
    ids=ids.concat(o.memos||[]);
    (o.subs||[]).forEach(wi);
  }
  (d.pins||[]).forEach(function(p){ ids=ids.concat(p.memos||[]); (p.objekte||[]).forEach(wi); });
  var g=d.gebaeude||{}; ids=ids.concat(g.memos||[]); (g.objekte||[]).forEach(wi);
  return ids;
}
function deleteProject(pid){
  try{
    var raw=localStorage.getItem("tga_proj_"+pid);
    if(raw){ collectMediaIds(JSON.parse(raw)).forEach(function(id){ mediaDel(id); }); }
  }catch(e){}
  localStorage.removeItem("tga_proj_"+pid);
  writeIndex(readIndex().filter(function(e){return e.pid!==pid;}));
  if(currentPid===pid){ currentPid=null; data=emptyProject(); renderCanvas(); closePanel(); showProjects(); }
}
function openProject(pid){
  currentPid=pid; data=loadProj(pid);
  try{ localStorage.setItem("tga_last",pid); }catch(e){}
  bgImg=null; current=null; view={mode:"room"}; setPlacing(false); planCtx="";
  startOv.style.display="none"; wzHide(); closePanel(); renderCanvas(); updateStorageChip(); applyLang();
  if(!data.projekt){ showPlan(); wzShow(1); } else { showDash(); }
}
function newProject(){
  var pid=uid();
  try{ localStorage.setItem("tga_proj_"+pid,JSON.stringify(emptyProject())); }catch(e){ alert(t("errStorage")); return; }
  var ix=readIndex(); ix.unshift({pid:pid,name:"",ort:"",rooms:0,updated:Date.now()}); writeIndex(ix);
  openProject(pid);
}

function setView(name){

  document.getElementById("navDash").classList.toggle("on",name==="dashView");
  document.getElementById("navPlan").classList.toggle("on",name==="planView"&&!planCtx);
  document.getElementById("gebBtn").classList.toggle("on",name==="infoPage");
  document.getElementById("projBtn").classList.toggle("on",name==="projPage");
  renderSideAreas();
}

function renderSideAreas(){

function dashData(){
  var st={rooms:(data.pins||[]).length,mains:0,subs:0,fotos:0,memos:(data.gebaeude.memos||[]).length,
          reqD:0,reqT:0,byClass:{}};
  function walk(o){
    var pr=instProgress(o); st.reqD+=pr.done; st.reqT+=pr.total;
    var f=o.fotos||{}; Object.keys(f).forEach(function(k){ st.fotos+=(f[k]||[]).length; });
    st.memos+=(o.memos||[]).length;
    if(o.art==="O"){ st.mains++; st.byClass[o.k]=(st.byClass[o.k]||0)+1; } else st.subs++;
    (o.subs||[]).forEach(walk);
  }
  (data.pins||[]).forEach(function(p){
    st.memos+=(p.memos||[]).length;
    var rp=roomProgress(p); st.reqD+=rp.done; st.reqT+=rp.total;
    var rf=p.fotos||{}; Object.keys(rf).forEach(function(k){ st.fotos+=(rf[k]||[]).length; });
    (p.objekte||[]).forEach(walk);
  });
  (data.gebaeude.objekte||[]).forEach(walk);
  return st;
}
function renderDashboard(){
  var v=document.getElementById("dashView"); v.innerHTML="";
  var st=dashData(), pj=data.projekt||{};
  var head=el("div","dash-head");
  var hb=el("div");
  hb.appendChild(el("h2","dtitle",pj.name||t("noName")));
  var addr=[pj.strasse,[pj.plz,pj.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  hb.appendChild(el("div","daddr",addr+(pj.baujahr?" · "+pj.baujahr:"")+((USER&&USER.name)?" · "+USER.name:"")));
  head.appendChild(hb); head.appendChild(el("div","spacer"));
  var toPlan=el("button","btn",t("dashToPlan"));
  toPlan.addEventListener("click",showPlan);
  head.appendChild(toPlan); v.appendChild(head);
  var tiles=el("div","tiles");
  [[st.rooms,"dashRooms",""],[st.mains,"dashObjects",""],[st.subs,"dashParts",""],
   [st.fotos,"dashPhotos",""],[st.memos,"dashMemos",""],
   [st.reqT-st.reqD,"dashOpenReq",(st.reqT-st.reqD)>0?"warn":""]].forEach(function(x){
    var d=el("div","dtile"+(x[2]?" "+x[2]:""));
    d.appendChild(el("div","n",String(x[0])));
    d.appendChild(el("div","l",t(x[1])));
    tiles.appendChild(d);
  });
  v.appendChild(tiles);
  var classes=Object.keys(st.byClass).sort(function(a,b){return st.byClass[b]-st.byClass[a];});
  var c1=el("div","dcard");
  c1.appendChild(el("h3",null,t("dashByClass")+" · "+t("dashLodNote")+" "+LOD));
  if(!classes.length) c1.appendChild(el("div","dash-empty",t("dashEmpty")));
  else{
    var max=st.byClass[classes[0]];
    classes.forEach(function(k){
      var row=el("div","brow");
      row.appendChild(el("div","bl",DASH_LBL[k]||k));
      var tr=el("div","btrack"); var bar=el("div","bbar");
      bar.style.width=Math.max(3,Math.round(st.byClass[k]/max*100))+"%";
      tr.appendChild(bar); row.appendChild(tr);
      row.appendChild(el("div","bval",String(st.byClass[k])));
      c1.appendChild(row);
    });
  }
  v.appendChild(c1);
  var c2=el("div","dcard");
  c2.appendChild(el("h3",null,t("dashRoomsList")+" ("+st.rooms+")"));
  if(!st.rooms) c2.appendChild(el("div","dash-empty",t("dashEmpty")));
  var groups=[{id:"",name:""}].concat(data.bereiche||[]);
  groups.forEach(function(g){
    var pinsIn=(data.pins||[]).filter(function(p){return (p.bereichId||"")===g.id;});
    if(!pinsIn.length) return;
    if(g.id||((data.bereiche||[]).length&&pinsIn.length))
      c2.appendChild(el("div","rt",(g.id?g.name+" ("+g.typ+")":((data.bereiche||[]).length?t("bereichNone"):""))));
    pinsIn.forEach(function(p){
    var objs=objAll(p);
    var d=0,tt=0; objs.forEach(function(o){var pr=instProgress(o); d+=pr.done; tt+=pr.total;});
    var rp2=roomProgress(p); d+=rp2.done; tt+=rp2.total;
    var row=el("div","rrow");
    var left=el("div");
    left.appendChild(el("span","rn",p.num+" · "+p.name));
    left.appendChild(el("div","rt",(p.raumtyp?rtLabel(p.raumtyp)+" · ":"")+objs.length+" "+t("dashObjects")));
    row.appendChild(left);
    row.appendChild(el("span","rp"+(tt&&d>=tt?" done":""),d+"/"+tt));
    row.appendChild(el("span",null,"›"));
    row.addEventListener("click",function(){ openPlanCtx(p.bereichId||""); openRoom(p.id); });
    c2.appendChild(row);
    });
  });
  v.appendChild(c2);
}
